name: Sync Atlas data from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Google Sheets CSV to compact JSON
        run: python3 sync_google_sheet.py
      - name: Validate municipal data before publishing
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Validate profile in original units
        run: node --v8-pool-size=1 test_profile_real_values.cjs
      - name: Validate variable queries
        run: node --v8-pool-size=1 test_atlas_query.cjs
      - name: Refresh the public cache version
        run: |
          version="$(sha256sum index.html atlas_data.json municipal_geometry.json | sha256sum | cut -c1-12)"
          printf '{"version":"%s"}\n' "$version" > version.json
      - name: Publish changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas_data.json version.json
          git diff --cached --quiet || git commit -m "Sync Atlas data from Google Sheets"
          git push
