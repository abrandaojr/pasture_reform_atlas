name: Sync Atlas data from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Google Sheets CSV to compact JSON
        run: python3 sync_google_sheet.py
      - name: Refresh the public cache version
        run: |
          version="$(sha256sum index.html atlas_data.json municipal_geometry.json | sha256sum | cut -c1-12)"
          printf '{"version":"%s"}\n' "$version" > version.json
      - name: Publish changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas_data.json version.json
          git diff --cached --quiet || git commit -m "Sync Atlas data from Google Sheets"
          git push
