<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1160" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193d32}.q{font-size:23px;font-weight:700}.body{font-size:19px}.big{font-size:40px;font-weight:700}.small{font-size:16px;fill:#53675e}</style><text x="24" y="34" class="q">How much pasture could improve?</text><text x="24" y="100" class="body">100 ha of pasture</text><rect x="24" y="125" width="259.2" height="44" fill="#b47b22"/><rect x="283.2" y="125" width="172.8" height="44" fill="#dce6dd"/><text x="24" y="221" class="big">60 ha</text><text x="24" y="252" class="body">low or medium vigor</text><text x="295.2" y="221" class="big">40 ha</text><text x="295.2" y="252" class="body">high vigor</text><text x="24" y="299" class="body">60% of the pasture merits a closer</text><text x="24" y="326" class="body">look.</text><path d="M24 355L456 355" fill="none" stroke="#c9d7ce" stroke-width="1"/><text x="24" y="390" class="q">What would help farmers improve</text><text x="24" y="417" class="q">it?</text><text x="24" y="484" class="body">30 of 100 ha near a slaughterhouse</text><text x="24" y="537" class="small">Also check drought, technical assistance</text><text x="24" y="564" class="small">and farmer education.</text><text x="24" y="650" class="q">Which environmental pressures</text><text x="24" y="677" class="q">need attention?</text><text x="24" y="744" class="body">3 of 5 indicators show very high</text><text x="24" y="771" class="body">pressure</text><text x="24" y="797" class="small">These are three warning signals, not 60%</text><text x="24" y="824" class="small">of the land.</text><path d="M24 930L456 930" fill="none" stroke="#00833e" stroke-width="2"/><text x="24" y="965" class="q">Where should we begin?</text><text x="24" y="1005" class="body">Visit the 60 ha, talk to farmers,</text><text x="24" y="1032" class="body">and use both assessments to plan</text><text x="24" y="1059" class="body">support.</text></svg>