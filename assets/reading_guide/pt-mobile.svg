<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1160" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193d32}.q{font-size:23px;font-weight:700}.body{font-size:19px}.big{font-size:40px;font-weight:700}.small{font-size:16px;fill:#53675e}</style><text x="24" y="34" class="q">Quanto pasto pode melhorar?</text><text x="24" y="100" class="body">100 ha de pasto</text><rect x="24" y="125" width="259.2" height="44" fill="#b47b22"/><rect x="283.2" y="125" width="172.8" height="44" fill="#dce6dd"/><text x="24" y="221" class="big">60 ha</text><text x="24" y="252" class="body">vigor baixo ou médio</text><text x="295.2" y="221" class="big">40 ha</text><text x="295.2" y="252" class="body">alto vigor</text><text x="24" y="299" class="body">60% do pasto merece uma avaliação</text><text x="24" y="326" class="body">mais próxima.</text><path d="M24 355L456 355" fill="none" stroke="#c9d7ce" stroke-width="1"/><text x="24" y="390" class="q">O que ajudaria os produtores a</text><text x="24" y="417" class="q">melhorar o pasto?</text><text x="24" y="484" class="body">30 de 100 ha próximos de</text><text x="24" y="511" class="body">frigorífico</text><text x="24" y="537" class="small">Confira também seca, assistência técnica</text><text x="24" y="564" class="small">e escolaridade.</text><text x="24" y="650" class="q">Quais pressões ambientais exigem</text><text x="24" y="677" class="q">atenção?</text><text x="24" y="744" class="body">3 de 5 indicadores mostram pressão</text><text x="24" y="771" class="body">muito alta</text><text x="24" y="797" class="small">São três sinais de atenção, não 60% do</text><text x="24" y="824" class="small">território.</text><path d="M24 930L456 930" fill="none" stroke="#00833e" stroke-width="2"/><text x="24" y="965" class="q">Por onde começar?</text><text x="24" y="1005" class="body">Visite os 60 ha, converse com os</text><text x="24" y="1032" class="body">produtores e use as duas avaliações</text><text x="24" y="1059" class="body">para planejar o apoio.</text></svg>