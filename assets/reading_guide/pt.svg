<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193d32}.q{font-size:23px;font-weight:700}.body{font-size:19px}.big{font-size:40px;font-weight:700}.small{font-size:16px;fill:#53675e}</style><text x="24" y="34" class="q">Quanto pasto pode melhorar?</text><text x="24" y="85" class="body">100 ha de pasto</text><rect x="24" y="110" width="631.1999999999999" height="44" fill="#b47b22"/><rect x="655.1999999999999" y="110" width="420.8" height="44" fill="#dce6dd"/><text x="24" y="206" class="big">60 ha</text><text x="24" y="237" class="body">vigor baixo ou médio</text><text x="667.1999999999999" y="206" class="big">40 ha</text><text x="667.1999999999999" y="237" class="body">alto vigor</text><text x="24" y="284" class="body">60% do pasto merece uma avaliação mais próxima.</text><path d="M24 335L1076 335" fill="none" stroke="#c9d7ce" stroke-width="1"/><text x="24" y="370" class="q">O que ajudaria os produtores a</text><text x="24" y="397" class="q">melhorar o pasto?</text><text x="24" y="464" class="body">30 de 100 ha próximos de frigorífico</text><text x="24" y="517" class="small">Confira também seca, assistência técnica e</text><text x="24" y="544" class="small">escolaridade.</text><text x="580" y="370" class="q">Quais pressões ambientais exigem</text><text x="580" y="397" class="q">atenção?</text><text x="580" y="464" class="body">3 de 5 indicadores mostram pressão muito</text><text x="580" y="491" class="body">alta</text><text x="580" y="517" class="small">São três sinais de atenção, não 60% do</text><text x="580" y="544" class="small">território.</text><path d="M24 610L1076 610" fill="none" stroke="#00833e" stroke-width="2"/><text x="24" y="645" class="q">Por onde começar?</text><text x="24" y="685" class="body">Visite os 60 ha, converse com os produtores e use as duas avaliações para planejar o apoio.</text></svg>