   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.53486px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="12.819814" y="30.464175" transform="rotate(-0 12.819814 30.464175)">A</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.905655px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="26.570422" y="29.768448" transform="rotate(-0 26.570422 29.768448)">Quanto pasto merece uma avaliação?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.009019px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="53.043909" transform="rotate(-0 12.819814 53.043909)">165,6 milhões de hectares de pasto · 2025</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13.27645px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="103.092447" transform="rotate(-0 12.819814 103.092447)">106,5 milhões ha</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.483178px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="119.771357" transform="rotate(-0 12.819814 119.771357)">Cerca de 64 de cada 100 ha têm vigor baixo ou médio.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.060702px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="153.353922" transform="rotate(-0 12.819814 153.353922)">O satélite ajuda a localizar pasto para avaliar em campo. Ele não informa o custo da recuperação.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.53486px; font-family: 'Arial'; text-anchor: start; fill: #222222" x="12.819814" y="175.082643" transform="rotate(-0 12.819814 175.082643)">B</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.905655px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="26.570422" y="174.386916" transform="rotate(-0 26.570422 174.386916)">Quantos estabelecimentos recebiam orientação?</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13.27645px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="235.382784" transform="rotate(-0 12.819814 235.382784)">Cerca de 20 de cada 100</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.53486px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="254.22108" transform="rotate(-0 12.819814 254.22108)">recebiam orientação técnica em 2017. O dado inclui todos os estabelecimentos agropecuários, não só</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.53486px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="265.738308" transform="rotate(-0 12.819814 265.738308)">os de pecuária.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.53486px; font-family: 'Arial'; text-anchor: start; fill: #193d32" x="12.819814" y="296.416389" transform="rotate(-0 12.819814 296.416389)">Confira o apoio disponível hoje antes de planejar a recuperação.</text>
   </g>
