<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193d32}.q{font-size:23px;font-weight:700}.body{font-size:19px}.big{font-size:40px;font-weight:700}.small{font-size:16px;fill:#53675e}</style><text x="24" y="34" class="q">How much pasture could improve?</text><text x="24" y="85" class="body">100 ha of pasture</text><rect x="24" y="110" width="631.1999999999999" height="44" fill="#b47b22"/><rect x="655.1999999999999" y="110" width="420.8" height="44" fill="#dce6dd"/><text x="24" y="206" class="big">60 ha</text><text x="24" y="237" class="body">low or medium vigor</text><text x="667.1999999999999" y="206" class="big">40 ha</text><text x="667.1999999999999" y="237" class="body">high vigor</text><text x="24" y="284" class="body">60% of the pasture merits a closer look.</text><path d="M24 335L1076 335" fill="none" stroke="#c9d7ce" stroke-width="1"/><text x="24" y="370" class="q">What would help farmers improve it?</text><text x="24" y="464" class="body">30 of 100 ha near a slaughterhouse</text><text x="24" y="517" class="small">Also check drought, technical assistance and</text><text x="24" y="544" class="small">farmer education.</text><text x="580" y="370" class="q">Which environmental pressures need</text><text x="580" y="397" class="q">attention?</text><text x="580" y="464" class="body">3 of 5 indicators show very high pressure</text><text x="580" y="517" class="small">These are three warning signals, not 60% of the</text><text x="580" y="544" class="small">land.</text><path d="M24 610L1076 610" fill="none" stroke="#00833e" stroke-width="2"/><text x="24" y="645" class="q">Where should we begin?</text><text x="24" y="685" class="body">Visit the 60 ha, talk to farmers, and use both assessments to plan support.</text></svg>